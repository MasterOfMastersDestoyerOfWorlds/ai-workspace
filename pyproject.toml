[project]
name = "ai-workspace-tools"
version = "0.1.0"
description = "Worktree helpers: wt (agents, safe) and land (user only, merges to master)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ixd = "ixd.cli:cli"

[dependency-groups]
dev = [
    "black>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ixd"]

[tool.black]
line-length = 110
target-version = ["py311"]
