[project]
name = "ai-workspace-tools"
version = "0.1.0"
description = "Worktree helpers: wt (agents, safe) and land (user only, merges to master)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wt = "tools.worktree_sync:cli"
land = "tools.worktree_land:cli"
setup = "tools.setup:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
